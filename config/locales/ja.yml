  security_mailer:
    password_reset_required:
      subject: "Aji Tracker のパスワードを再設定してください"
      greeting: "%{username} さん"
      what_happened: "2026年4月8日から9月14日までの間、手違いにより、アプリのデータベースのコピーがGitHub上の公開コードリポジトリからダウンロードできる状態になっていました。これには、メールアドレス、ユーザー名、ペット、給餌記録、健康診断の結果、そして暗号学的にハッシュ化（bcrypt）されたパスワードが含まれていました。ハッシュ化されたパスワードを直接元に戻すことはできませんが、簡単なパスワードや一般的なパスワードは推測される可能性があります。"
      what_we_did: "コピーはリポジトリから削除済みで、GitHubに残っているコピーの削除も依頼しました。念のため、パスワードをランダムなものに置き換え、すべてのデバイスからサインアウトしました。"
      what_to_do_html: "再度サインインするには、%{forgot_password_link}でこのメールアドレスを使って新しいパスワードを設定してください。Google、LINE、GitHubでサインインしている場合は、これまでどおりご利用いただけます。"
      what_to_do_text: "再度サインインするには、「パスワードをお忘れですか」のページでこのメールアドレスを使って新しいパスワードを設定してください。Google、LINE、GitHubでサインインしている場合は、これまでどおりご利用いただけます："
