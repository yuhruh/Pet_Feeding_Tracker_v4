  privacy_page:
    title: プライバシーポリシー
    intro: 猫の給餌トラッカーは、ペットが何を食べ、健康状態がどう変化したかを記録するための小さな個人向けアプリです。このページでは、保存する情報とその目的、そして決して行わないことを説明します。
    sections:
    - heading: 保存する情報
      body: |-
        アカウント：メールアドレス、ユーザー名、タイムゾーン、ハッシュ化されたパスワード（元のパスワードには戻せません）。
        ペット：名前、誕生日、品種、性別、体重、任意の写真。
        記録：給餌記録、体重、メモ、健康診断の数値、通院時の質問と回答。
        Google・LINE・GitHub でサインインした場合は、次回の識別に必要なアカウント識別子のみを保存します。
    - heading: 保存する理由
      body: あなた自身の記録を表示し、グラフを描き、ご希望のメールをお送りするためだけに使用します。データを販売することはなく、広告に利用することもなく、第三者と共有することもありません。ただし、以下のあなた自身が選ぶ2つの場合を除きます。
    - heading: あなたが選んで共有するもの
      body: |-
        共有リンク：ペットの共有リンクを作成すると、そのリンクを知っている人は誰でもサインインせずにそのペットの給餌記録とグラフを閲覧できます。獣医やペットシッターなど、信頼できる相手にのみ共有してください。リンクの有効期限の設定、新しいリンクへの置き換え、共有のオフは、ペットの給餌記録ページからいつでも行えます。
        通院メンバー：メールで招待した相手は、その通院の質問を閲覧し、回答できます。
    - heading: 利用しているサービス
      body: |-
        Gmail：本アプリは Gmail アカウント ajicaretracker@gmail.com から自身のメール（パスワード再設定、ようこそメール、データのバックアップ）を送信します。使用するのは送信権限のみで、あなたのものを含むいかなるメールボックスも読み取り・検索・削除しません。
        Google Gemini：あなたがご自身の Gemini キーを設定し、健康診断報告書の画像をアップロードして自動読み取りを行う場合のみ使用します。画像はその目的のためだけに Google へ送信されます。
        LINE：LINE アカウントを連携した場合のみ、リマインダーの送信に使用します。
        ホスティング：本アプリとデータベースは Railway 上で動作しています。
    - heading: 保存期間と削除方法
      body: 記録はあなたが削除するまで保存されます。プロフィールページからアカウントを削除すると、ペット、給餌記録、健康診断、通院記録もすべて削除されます。給餌記録はいつでも
        CSV ファイルとして書き出せます。
    - heading: Cookie
      body: サインイン状態を保つために Cookie を1つ使用します。広告や追跡のための Cookie は使用しません。
    contact_email: ajicaretracker@gmail.com
    contact: 本ポリシーに関するご質問、またはデータの削除をご希望の場合は %{email} までご連絡ください。
    updated: 最終更新日：2026年9月16日
  terms_page:
    title: 利用規約
    intro: 猫の給餌トラッカーは、現状のまま提供される無料の個人プロジェクトです。本アプリを利用することで、以下の内容に同意したものとみなされます。
    sections:
    - heading: 獣医学的助言ではありません
      body: 本アプリは情報を記録するものであり、解釈するものではありません。自動読み取りされた健康診断の数値やグラフを含め、本アプリのいかなる内容も獣医学的助言ではありません。ペットの健康については必ず資格のある獣医師にご相談ください。報告書の写真から自動で読み取った数値は誤ることがあるため、必ず原本と照合してください。
    - heading: アカウント
      body: パスワードは他人に教えず、ご自身が管理できるメールアドレスをご利用ください。アカウントで行われた操作、および共有リンクを渡した相手の行動については、あなたが責任を負います。
    - heading: 適切な利用
      body: 本アプリはご自身のペットのためにご利用ください。他人のアカウントや記録へのアクセス、本アプリの妨害、違法な内容の送信に利用しないでください。
    - heading: 提供状況とデータ
      body: |-
        本アプリは個人が趣味として運営しています。利用できない場合や、機能が変更・終了する場合があります。大切なデータはご自身でも保管してください。給餌記録は CSV ファイルとして書き出せるほか、バックアップをメールでお送りします。
        本アプリはいかなる保証も伴わずに提供され、作者は利用によって生じた損害について責任を負いません。
    - heading: 利用の終了
      body: プロフィールページからいつでもアカウントを削除でき、記録も同時に削除されます。サービスを濫用したアカウントは削除される場合があります。
    - heading: 規約の変更
      body: 本規約は変更されることがあります。ページ上部の日付が最新版を示します。
